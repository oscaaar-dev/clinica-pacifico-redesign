# /etc/nginx/sites-available/clinica-pacifico
# Sirve el export estático de Next.js (carpeta out/) copiado a /var/www/clinica-pacifico.
# Después de activar el sitio, ejecuta: sudo certbot --nginx -d demo.tu-dominio.com

server {
    listen 80;
    server_name demo.tu-dominio.com;

    root /var/www/clinica-pacifico;
    index index.html;

    # Prototipo no oficial: que no lo indexen los buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Archivos con hash generados por Next.js: caché de 1 año.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
