# /etc/nginx/sites-available/clinica-pacifico
# Sirve el export estático de Next.js (carpeta out/) copiado a /var/www/clinica-pacifico.
# Sitio independiente: no comparte server block con otros sitios del VPS.
# Copia del archivo del servidor. Las líneas "managed by Certbot" las agregó
# `certbot --nginx -d clinica.169.58.110.225.sslip.io --redirect` (HTTPS con Let's Encrypt, renovación automática).

server {
    server_name clinica.169.58.110.225.sslip.io;

    root /var/www/clinica-pacifico;
    index index.html;

    # Prototipo no oficial: que no lo indexen los buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Archivos con hash generados por Next.js: caché de 1 año.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/clinica.169.58.110.225.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clinica.169.58.110.225.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = clinica.169.58.110.225.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name clinica.169.58.110.225.sslip.io;
    return 404; # managed by Certbot


}